<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f4f6fc;
            color: #2D3748;
        }
        .navbar {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%) !important;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 1rem 1.5rem;
        }
        .navbar-brand {
            font-weight: 700;
            letter-spacing: -0.5px;
            font-size: 1.35rem;
        }
        .nav-link {
            font-weight: 500;
            color: rgba(255, 255, 255, 0.75) !important;
            transition: all 0.2s ease;
            margin-right: 0.5rem;
        }
        .nav-link:hover, .nav-link.active {
            color: #ffffff !important;
        }
        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
            background-color: #ffffff;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card-header {
            border-bottom: 1px solid #f1f5f9;
            font-weight: 600;
            background-color: #ffffff !important;
        }
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            border: none;
            font-weight: 600;
            border-radius: 10px;
            padding: 0.55rem 1.4rem;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
            transition: all 0.2s;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.3);
        }
        .btn-outline-light {
            border-radius: 10px;
            font-weight: 500;
            padding: 0.45rem 1.2rem;
            border-color: rgba(255,255,255,0.25);
        }
        .btn-outline-light:hover {
            background-color: rgba(255,255,255,0.1);
            border-color: #ffffff;
        }
        .table thead {
            background-color: #f8fafc;
        }
        .table th {
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.8px;
            color: #64748b;
            padding: 1.2rem 1rem;
            border-bottom: 2px solid #f1f5f9;
        }
        .table td {
            padding: 1.2rem 1rem;
            vertical-align: middle;
            color: #334155;
            font-size: 0.92rem;
        }
        .form-control, .form-select {
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 0.7rem 1.1rem;
            font-size: 0.95rem;
        }
        .form-control:focus, .form-select:focus {
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
            border-color: #3b82f6;
        }
        .badge {
            padding: 0.5em 0.9em;
            font-weight: 600;
            border-radius: 8px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="{{ url_for('index') }}">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16">
                  <path d="M1 2.828c.885-.37 2.154-.769 3.388-.893 1.33-.134 2.458.063 3.112.752v9.746c-.935-.53-2.12-.603-3.213-.493-1.18.12-2.37.461-3.287.811V2.828zm7.5-.141c.654-.689 1.782-.886 3.112-.752 1.234.124 2.503.523 3.388.893v9.923c-.918-.35-2.107-.692-3.287-.81-1.094-.111-2.278.039-3.213.492V2.687z"/>
                </svg>
                <span>Library Hub</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav me-auto ms-3">
                    <a class="nav-link" href="{{ url_for('index') }}">Books Catalog</a>
                    <a class="nav-link" href="{{ url_for('customers') }}">Customers Directory</a>
                    <a class="nav-link" href="{{ url_for('transactions') }}">Issue History</a>
                </div>
                <div class="d-flex gap-2 align-items-center">
                    <a href="{{ url_for('add_customer') }}" class="btn btn-outline-light btn-sm">+ Add Customer</a>
                    <a href="{{ url_for('add_book') }}" class="btn btn-primary btn-sm">+ Add Book</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} border-0 shadow-sm alert-dismissible fade show mb-4" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
